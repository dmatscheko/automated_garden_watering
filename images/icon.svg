<?xml version="1.0" encoding="UTF-8"?>
<!--
  Automated Garden Watering — integration icon.
  Flat, Home Assistant brand style: single HA-blue (#18BCF2) glyph on a
  transparent background (see https://github.com/home-assistant/brands).
  A water drop (watering) holding a white sprout (garden).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Water drop -->
  <path d="M128 16
           C 128 16, 36 108, 36 158
           a 92 92 0 0 0 184 0
           C 220 108, 128 16, 128 16 Z"
        fill="#18BCF2"/>

  <!-- Sprout: stem -->
  <path d="M128 214 L 128 164"
        stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" fill="none"/>

  <!-- Sprout: right leaf -->
  <path d="M128 166
           C 128 138, 150 120, 182 120
           C 182 150, 158 166, 128 166 Z"
        fill="#FFFFFF"/>

  <!-- Sprout: left leaf -->
  <path d="M128 186
           C 128 158, 106 142, 80 142
           C 80 168, 102 186, 128 186 Z"
        fill="#FFFFFF"/>
</svg>
