# Example Lovelace dashboard view for Automated Garden Watering.
#
# TIP: instead of hand-editing this, press the "Generate dashboard YAML" button
# the integration creates (button.automated_garden_watering_generate_dashboard_yaml).
# It produces this same layout pre-filled with your real entity_ids and zones.
#
# Paste under "views:" in your dashboard YAML, or use as a starting point in the
# UI editor. Replace the example zone unique IDs with the ones you actually have
# in `button.automated_garden_watering_zone_*` — the suffix is the slugified
# zone display name (e.g. `Fensterblumen` → `…_zone_fensterblumen`), so the
# entity_id stays stable when you reorder zones.
#
# The cards below color buttons by status using the `extra_state_attributes`
# exposed by each zone button (`status` = idle | queued | running), the backwash
# button (`status` = idle | running) and the Water all button (`running`).

title: Garden
path: garden
icon: mdi:sprinkler
cards:
  - type: vertical-stack
    cards:
      # Row 1: Water all + Details. Tapping Details reveals the status list below
      # (the global actions and zones stay the same full size in a second grid).
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            entity: button.automated_garden_watering_water_all
            name: Water all / STOP
            icon: mdi:sprinkler-variant
            show_state: false
            # Subtle primary-color tint so the main action stands out at rest;
            # blue icon to match the other 3 main buttons (Details, Backwash, Pump).
            styles:
              card:
                - background-color: color-mix(in srgb, var(--primary-color) 22%, var(--card-background-color))
              icon:
                - color: var(--paper-item-icon-color, var(--state-icon-color))
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.automated_garden_watering_water_all
            state:
              - operator: template
                value: >-
                  [[[ return states['button.automated_garden_watering_water_all'].attributes.running === true ]]]
                styles:
                  card:
                    - background-color: '#2e7d32'
                    - color: white
                  icon:
                    - color: var(--state-switch-active-color, var(--paper-item-icon-active-color, #fdd835))
          - type: custom:button-card
            entity: switch.automated_garden_watering_show_details
            name: Details
            icon: mdi:information-outline
            show_state: false
            tap_action:
              action: toggle
            state:
              - value: 'on'
                styles:
                  card:
                    - background-color: '#2e7d32'
                    - color: white

      # Hidden by default; revealed when "Details" (the Show details switch) is on.
      - type: conditional
        conditions:
          - entity: switch.automated_garden_watering_show_details
            state: 'on'
        card:
          type: entities
          show_header_toggle: false
          entities:
            - entity: sensor.automated_garden_watering_status
              name: Status
            - entity: sensor.automated_garden_watering_current_step_time_remaining
              name: Current step time remaining
            - entity: sensor.automated_garden_watering_queue_time_remaining
              name: Queue time remaining
            - entity: sensor.automated_garden_watering_total_watering_time
              name: Total watering time
            - entity: sensor.automated_garden_watering_active_zone
              name: Active zone
            - entity: sensor.automated_garden_watering_queue
              name: Queue
            - entity: number.automated_garden_watering_watering_multiplier
              name: Watering multiplier
            - entity: time.automated_garden_watering_daily_start_time
              name: Daily start time
            - entity: switch.automated_garden_watering_daily_timer
              name: Daily timer
            - entity: switch.automated_garden_watering_manual_pump_backwash
              name: Backwash during manual pumping

      # Remaining buttons, same full size: Backwash, Pump, then the zones.
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            entity: button.automated_garden_watering_backwash
            name: Backwash
            icon: mdi:backup-restore
            show_state: false
            show_label: true
            # Blue icon to match the other 3 main buttons.
            styles:
              icon:
                - color: var(--paper-item-icon-color, var(--state-icon-color))
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.automated_garden_watering_backwash
            state:
              - operator: template
                value: >-
                  [[[ return states['button.automated_garden_watering_backwash'].attributes.status === 'running' ]]]
                styles:
                  card:
                    - background-color: '#2e7d32'
                    - color: white
                  icon:
                    - color: var(--state-switch-active-color, var(--paper-item-icon-active-color, #fdd835))
            label: >-
              [[[
                const a = states['button.automated_garden_watering_backwash'].attributes;
                if (a.status === 'running') return 'Running';
                if (a.last_run_friendly) return 'Last: ' + a.last_run_friendly;
                return 'Never run';
              ]]]
          # Manual pump is a switch -> tap toggles it. Green while on, with a
          # "last run" line when off (like the zone buttons).
          - type: custom:button-card
            entity: switch.automated_garden_watering_pump_manual
            name: Pump (manual)
            icon: mdi:water-pump
            show_state: false
            show_label: true
            tap_action:
              action: toggle
            state:
              - value: 'on'
                styles:
                  card:
                    - background-color: '#2e7d32'
                    - color: white
            label: >-
              [[[
                const e = states['switch.automated_garden_watering_pump_manual'];
                if (e.state === 'on') return 'On';
                if (e.attributes.last_run_friendly) return 'Last: ' + e.attributes.last_run_friendly;
                return 'Never run';
              ]]]
          # Repeat this block for each zone. Color reflects `status` attribute:
          #   idle = default, queued = amber, running = green.
          - type: custom:button-card  # optional; falls back to plain button if not installed
            entity: button.automated_garden_watering_zone_REPLACE_ME
            name: Zone 1
            icon: mdi:water
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.automated_garden_watering_zone_REPLACE_ME
            state:
              - operator: template
                value: >-
                  [[[ return states['button.automated_garden_watering_zone_REPLACE_ME'].attributes.status === 'running' ]]]
                styles:
                  card:
                    - background-color: '#2e7d32'
                    - color: white
              - operator: template
                value: >-
                  [[[ return states['button.automated_garden_watering_zone_REPLACE_ME'].attributes.status === 'queued' ]]]
                styles:
                  card:
                    - background-color: '#ef6c00'
                    - color: white
            label: >-
              [[[
                const a = states['button.automated_garden_watering_zone_REPLACE_ME'].attributes;
                if (a.status === 'running') return 'Running · ' + Math.max(0, a.remaining_seconds || 0) + 's left';
                if (a.status === 'queued') return 'Queued #' + a.queue_position;
                if (a.last_run_friendly) return 'Last: ' + a.last_run_friendly;
                return 'Never run';
              ]]]

# Notes
# -----
# * The `custom:button-card` card (HACS frontend) is recommended for colored,
#   templated zone buttons. Without it, use the built-in `type: button` card —
#   you lose status coloring but the press action still works.
# * The countdown sensors (`*_time_remaining`, `*_total_watering_time`) show
#   H:MM:SS as their state and expose `hours` / `minutes` / `seconds` /
#   `total_seconds` / `formatted` attributes for custom rendering.
