[project]
name = "automated-garden-watering"
version = "0.7.0"
description = "Home Assistant custom integration for queue-based garden irrigation."
requires-python = ">=3.13.2"
# Runtime deps are provided by Home Assistant itself; nothing extra needed.
dependencies = []

[tool.uv]
# pytest-homeassistant-custom-component pins to HA pre-releases.
prerelease = "allow"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-homeassistant-custom-component>=0.13.250",
    "mypy>=1.13",
    "types-PyYAML",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_decorators = false
files = ["custom_components/automated_garden_watering"]

[[tool.mypy.overrides]]
# HA's helpers occasionally fall back to dynamic typing.
module = "homeassistant.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Dashboard YAML is opaque text generation; let it skip strict mode for now.
module = "custom_components.automated_garden_watering.dashboard"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.coverage.run]
source = ["custom_components/automated_garden_watering"]
omit = [
    "custom_components/automated_garden_watering/__pycache__/*",
    "custom_components/automated_garden_watering/dashboard.py",
]
branch = false

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]
